version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    # PHPUnit 12 requires PHP 8.3 and 13 requires PHP 8.4, above this repo's CI
    # floor. Revisit when the floor rises.
    ignore:
      - dependency-name: "phpunit/phpunit"
        versions: [">= 12"]
